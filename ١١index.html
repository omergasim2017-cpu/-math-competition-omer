<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مسابقة الرياضيات — أستاذ عمر قاسم</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:linear-gradient(135deg,#08152f,#12606d);color:#fff;min-height:100vh}button{font:inherit;cursor:pointer}.app{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand h1{margin:0;font-size:clamp(27px,5vw,44px)}.brand p{opacity:.8}.nav button,.secondary{padding:10px 15px;border:0;border-radius:12px;background:#ffffff20;color:#fff}.scores{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0}.team{background:#ffffff15;border:1px solid #ffffff25;border-radius:15px;padding:12px;text-align:center}.pts{font-size:28px;font-weight:bold;margin-top:5px}.main{background:#fff;color:#14243a;border-radius:24px;padding:30px;min-height:550px}.center{text-align:center;display:flex;min-height:480px;align-items:center;justify-content:center;flex-direction:column}.hero{font-size:clamp(38px,7vw,65px);margin:10px}.sub{font-size:19px;color:#60738d;line-height:1.8}.primary{background:#1267d8;color:#fff;border:0;border-radius:14px;padding:15px 26px;font-weight:bold;font-size:19px}.head{display:flex;justify-content:space-between;align-items:center}.badge,.timer{padding:9px 13px;border-radius:11px;background:#eaf2ff;color:#1267d8;font-weight:bold}.timer{background:#fff1df;color:#ad5c00}.q{font-size:clamp(25px,4vw,38px);line-height:1.5}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{padding:20px;border:2px solid #dce5ef;border-radius:15px;background:#f5f8fb;text-align:right;font-size:20px}.selected{border-color:#1267d8;background:#eaf2ff}.correct{border-color:#19945a;background:#e9fff3}.wrong{border-color:#d33;background:#fff0f0}.explain{margin:18px 0;padding:15px;border-right:5px solid #1267d8;background:#f4f9ff;line-height:1.8}.teams{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.teambtn{padding:14px 7px;border:0;border-radius:13px;background:#12345b;color:#fff;font-weight:bold}.done{background:#19945a}.controls,.manual{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.manual button{border:0;border-radius:8px;padding:7px 10px}.rank{display:flex;justify-content:space-between;padding:15px;background:#f3f6fa;border-radius:12px;margin:8px auto;max-width:700px}.winner{background:#fff1bd;border:2px solid #d9ad20}@media(max-width:800px){.scores{grid-template-columns:repeat(2,1fr)}.choices,.teams{grid-template-columns:1fr}.main{padding:18px}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><h1>🏆 مسابقة الرياضيات</h1><p>أستاذ عمر قاسم • مسابقة صفية تفاعلية</p></div>
<nav><button onclick="home()">الرئيسية</button> <button onclick="rules()">القواعد</button></nav></header>
<section id="scores" class="scores"></section><main id="main" class="main"></main>
</div>
<script>
const teams=['فريق النخبة','فريق العباقرة','فريق المتفوقين','فريق الأبطال','فريق القمة'];
const qs=[
['تقطع سيارة 180 كيلومترًا في 3 ساعات. ما معدل السرعة؟',['30 كم/ساعة','60 كم/ساعة','90 كم/ساعة','120 كم/ساعة'],1,'معدل السرعة = المسافة ÷ الزمن = 180 ÷ 3 = 60 كم/ساعة.'],
['اشترى أحمد 4 أقلام مقابل 12 درهمًا. ما سعر القلم الواحد؟',['2 درهم','3 دراهم','4 دراهم','6 دراهم'],1,'سعر القلم الواحد = 12 ÷ 4 = 3 دراهم.'],
['يقرأ طالب 45 صفحة في 5 أيام بالمعدل نفسه. كم صفحة يقرأ يوميًا؟',['5 صفحات','8 صفحات','9 صفحات','10 صفحات'],2,'المعدل اليومي = 45 ÷ 5 = 9 صفحات.'],
['قطعت دراجة 72 كيلومترًا خلال 4 ساعات. ما معدل المسافة في الساعة؟',['16 كم/ساعة','18 كم/ساعة','20 كم/ساعة','24 كم/ساعة'],1,'72 ÷ 4 = 18 كم/ساعة.'],
['إذا كان ثمن 6 زجاجات ماء هو 18 درهمًا، فما معدل السعر لكل زجاجة؟',['2 درهم','3 دراهم','4 دراهم','6 دراهم'],1,'18 ÷ 6 = 3 دراهم لكل زجاجة.'],
['تستهلك سيارة 8 لترات من الوقود لقطع 100 كم. كم لترًا تستهلك لكل 50 كم بالمعدل نفسه؟',['2 لتر','4 لترات','6 لترات','8 لترات'],1,'50 كم نصف 100 كم، لذلك الاستهلاك = 8 ÷ 2 = 4 لترات.'],
['يعمل عامل 24 ساعة خلال 4 أيام بالمعدل نفسه. كم ساعة يعمل يوميًا؟',['4 ساعات','6 ساعات','8 ساعات','12 ساعة'],1,'24 ÷ 4 = 6 ساعات يوميًا.'],
['أي معدل يمثل 5 تفاحات مقابل 10 دراهم؟',['1 تفاحة لكل درهم','2 تفاحتان لكل درهم','5 تفاحات لكل درهم','10 تفاحات لكل درهم'],1,'10 ÷ 5 = 2؛ أي تفاحتان لكل درهم.'],
['تقطع حافلة 240 كم في 4 ساعات. كم تقطع في ساعة واحدة بالمعدل نفسه؟',['40 كم','50 كم','60 كم','80 كم'],2,'240 ÷ 4 = 60 كم في الساعة.'],
['إذا كان 3 كجم من التفاح تكلف 15 درهمًا، فما سعر الكيلوجرام الواحد؟',['3 دراهم','5 دراهم','6 دراهم','8 دراهم'],1,'15 ÷ 3 = 5 دراهم لكل كيلوجرام.'],
['يملأ صنبور 30 لترًا من الماء في 5 دقائق. ما معدل التدفق؟',['5 لترات/دقيقة','6 لترات/دقيقة','10 لترات/دقيقة','15 لترًا/دقيقة'],1,'30 ÷ 5 = 6 لترات في الدقيقة.'],
['ركض لاعب 12 كيلومترًا في ساعتين. ما معدل سرعته؟',['4 كم/ساعة','5 كم/ساعة','6 كم/ساعة','8 كم/ساعة'],2,'12 ÷ 2 = 6 كم/ساعة.'],
['دفعت سارة 28 درهمًا مقابل 7 دفاتر. ما معدل تكلفة الدفتر الواحد؟',['3 دراهم','4 دراهم','5 دراهم','7 دراهم'],1,'28 ÷ 7 = 4 دراهم للدفتر.'],
['إذا كان معدل إنتاج آلة هو 120 قطعة في 6 ساعات، فكم قطعة تنتج في الساعة؟',['15 قطعة','20 قطعة','25 قطعة','30 قطعة'],1,'120 ÷ 6 = 20 قطعة في الساعة.'],
['يستطيع طالب حل 36 مسألة في 4 ساعات بالمعدل نفسه. كم مسألة يحل في 7 ساعات؟',['49','54','63','72'],2,'المعدل = 36 ÷ 4 = 9 مسائل/ساعة، وفي 7 ساعات: 9 × 7 = 63.']
];
let s={page:'home',q:0,sel:null,reveal:false,award:null,score:[0,0,0,0,0],sec:60};
let timer=null;
function save(){localStorage.setItem('mathOmer',JSON.stringify(s))}
function load(){try{let x=JSON.parse(localStorage.getItem('mathOmer'));if(x)s=x}catch(e){}}
function scores(){document.getElementById('scores').innerHTML=teams.map((t,i)=>`<div class="team"><b>${t}</b><div class="pts">${s.score[i]}</div><small>نقطة</small></div>`).join('')}
function home(){clearInterval(timer);timer=null;s={page:'home',q:0,sel:null,reveal:false,award:null,score:[0,0,0,0,0],sec:60};save();render()}
function start(){clearInterval(timer);timer=null;s={page:'game',q:0,sel:null,reveal:false,award:null,score:[0,0,0,0,0],sec:60};save();render()}
function render(){scores();if(s.page==='home')homeView();else if(s.page==='result')result();else game()}
function homeView(){main.innerHTML=`<div class="center"><div style="font-size:70px">➗</div><h2 class="hero">جاهزون للتحدي؟</h2><p class="sub">15 سؤالًا • 5 فرق • 10 نقاط للسؤال<br>مسابقة تفاعلية للصف.</p><button class="primary" onclick="start()">ابدأ المسابقة</button></div>`}
function game(){let q=qs[s.q],L=['أ','ب','ج','د'];main.innerHTML=`<div class="head"><span class="badge">السؤال ${s.q+1} من 15</span><span class="timer">⏱ ${s.sec} ثانية</span></div><h2 class="q">${q[0]}</h2><div class="choices">${q[1].map((x,i)=>`<button class="choice ${s.sel===i?'selected':''} ${s.reveal&&i===q[2]?'correct':''} ${s.reveal&&s.sel===i&&i!==q[2]?'wrong':''}" onclick="answer(${i})">${L[i]}) ${x}</button>`).join('')}</div>${s.reveal?`<div class="explain"><b>الإجابة الصحيحة: ${L[q[2]]}) ${q[1][q[2]]}</b><br>${q[3]}</div><h3>من أجاب؟</h3><div class="teams">${teams.map((t,i)=>`<button class="teambtn ${s.award===i?'done':''}" onclick="award(${i})" ${s.award!==null?'disabled':''}>${t}<br>${s.award===i?'✓ تم التسجيل':'+10 نقاط'}</button>`).join('')}</div>`:''}<div class="controls"><button class="secondary" onclick="toggleTimer()">${timer?'إيقاف المؤقت':'تشغيل المؤقت'}</button><button class="secondary" onclick="resetTimer()">إعادة المؤقت</button>${s.reveal&&s.award!==null?`<button class="primary" onclick="next()">${s.q===14?'النتيجة النهائية':'السؤال التالي'}</button>`:''}</div><div class="manual"><b>تعديل النقاط:</b>${teams.map((t,i)=>`<span>${t} <button onclick="chg(${i},10)">+10</button><button onclick="chg(${i},5)">+5</button><button onclick="chg(${i},-5)">-5</button></span>`).join('')}</div>`}
function answer(i){if(s.reveal)return;s.sel=i;s.reveal=true;clearInterval(timer);timer=null;save();render()}
function award(i){if(!s.reveal||s.award!==null)return;s.score[i]+=10;s.award=i;save();render()}
function chg(i,n){s.score[i]=Math.max(0,s.score[i]+n);save();scores()}
function next(){clearInterval(timer);timer=null;if(s.q===14)s.page='result';else{s.q++;s.sel=null;s.reveal=false;s.award=null;s.sec=60}save();render()}
function toggleTimer(){if(timer){clearInterval(timer);timer=null}else{timer=setInterval(()=>{s.sec--;if(s.sec<=0){s.sec=0;clearInterval(timer);timer=null}save();render()},1000)}render()}
function resetTimer(){clearInterval(timer);timer=null;s.sec=60;save();render()}
function result(){let a=teams.map((name,i)=>({name,score:s.score[i]})).sort((a,b)=>b.score-a.score);main.innerHTML=`<div class="center"><div style="font-size:70px">🏆</div><h2 class="hero" style="font-size:48px">النتيجة النهائية</h2><p class="sub">الفائز: <b>${a[0].name}</b> — ${a[0].score} نقطة</p>${a.map((x,i)=>`<div class="rank ${i===0?'winner':''}"><span>${i+1}. ${x.name}</span><b>${x.score} نقطة</b></div>`).join('')}<br><button class="primary" onclick="start()">إعادة المسابقة</button></div>`}
function rules(){alert('قواعد المسابقة\\n\\n15 سؤالًا، كل سؤال 10 نقاط.\\nاختر الإجابة ثم اكشفها، وبعدها اختر الفريق الذي أجاب.\\nيمكن تعديل النقاط يدويًا.\\nالمؤقت اختياري ومدته 60 ثانية.')}
load();render();
</script>
</body></html>
